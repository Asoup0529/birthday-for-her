<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>給最愛的妳 ❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Microsoft JhengHei", sans-serif;
  overflow: hidden;
}

.page {
  width: 100vw;
  height: 100vh;
  position: absolute;
  top: 0;
  left: 0;
}

/* 第一頁 */
#page1 {
  background: url("cover.jpg") center/cover no-repeat;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: opacity 2s ease;
  z-index: 2;
}

#page1.hide {
  opacity: 0;
  pointer-events: none;
}

/* 第二頁 */
#page2 {
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  display: flex;
  justify-content: center;
  align-items: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 2.5s ease;
  z-index: 1;
  position: relative;
  padding: 30px;
}

#page2.show {
  opacity: 1;
  pointer-events: auto;
}

/* 第二頁內容 */
.content {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 40px;
  width: 100%;
  max-width: 1000px;
  z-index: 2;
}

/* 左邊圖片 */
.left-image img {
  width: 320px;
  max-width: 40vw;
  border-radius: 24px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  animation: floatPhoto 3s ease-in-out infinite;
}

/* 右邊文字 */
.right-text {
  color: white;
  max-width: 420px;
  text-align: left;
}

.right-text h1 {
  font-size: 42px;
  margin-bottom: 20px;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 2s ease forwards;
  animation-delay: 0.8s;
}

.right-text p {
  font-size: 20px;
  line-height: 2;
  margin: 0;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 2.5s ease forwards;
  animation-delay: 1.6s;
}

.right-text .signature {
  margin-top: 20px;
  font-size: 18px;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 2.5s ease forwards;
  animation-delay: 2.5s;
}

/* 按鈕 */
button {
  padding: 14px 30px;
  font-size: 18px;
  border: none;
  border-radius: 999px;
  background: rgba(255,255,255,0.95);
  color: #ff4f81;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  animation: pulse 1.8s infinite;
}

@keyframes pulse {
  0% { transform: scale(1); box-shadow: 0 0 0 rgba(255,255,255,0.4); }
  50% { transform: scale(1.08); box-shadow: 0 0 25px rgba(255,255,255,0.7); }
  100% { transform: scale(1); box-shadow: 0 0 0 rgba(255,255,255,0.4); }
}

@keyframes floatPhoto {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-8px); }
  100% { transform: translateY(0px); }
}

@keyframes fadeUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* 愛心背景 */
.heart {
  position: absolute;
  width: 20px;
  height: 20px;
  background: rgba(255, 0, 85, 0.75);
  transform: rotate(45deg);
  animation: float 5s linear forwards;
  z-index: 0;
}

.heart::before,
.heart::after {
  content: "";
  position: absolute;
  width: 20px;
  height: 20px;
  background: rgba(255, 0, 85, 0.75);
  border-radius: 50%;
}

.heart::before {
  top: -10px;
  left: 0;
}

.heart::after {
  left: -10px;
  top: 0;
}

@keyframes float {
  0% {
    transform: translateY(100vh) rotate(45deg);
    opacity: 1;
  }
  100% {
    transform: translateY(-20vh) rotate(45deg);
    opacity: 0;
  }
}

/* 手機版 */
@media (max-width: 768px) {
  #page2 {
    padding: 20px;
  }

  .content {
    flex-direction: column;
    gap: 20px;
    text-align: center;
  }

  .left-image img {
    width: 240px;
    max-width: 75vw;
  }

  .right-text {
    text-align: center;
    max-width: 90%;
  }

  .right-text h1 {
    font-size: 34px;
  }

  .right-text p {
    font-size: 17px;
    line-height: 1.8;
  }
}
</style>
</head>

<body>

<!-- 第一頁 -->
<div id="page1" class="page">
  <button onclick="startPage()">點我一下 💖</button>
</div>

<!-- 第二頁 -->
<div id="page2" class="page">
  <div class="content">
    <div class="left-image">
      <img src="photo.jpg" alt="照片">
    </div>

    <div class="right-text">
      <h1>生日快樂 ❤️</h1>
      <p>
        謝謝妳出現在我的生命裡 💕<br>
        有妳的每一天都變得特別又幸福。<br>
        希望妳每天都開開心心，<br>
        也希望未來每一個重要時刻都有我陪妳一起度過。
      </p>
      <div class="signature">給最可愛的妳 ✨</div>
    </div>
  </div>
</div>

<audio id="bgm" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
function startPage() {
  const page1 = document.getElementById("page1");
  const page2 = document.getElementById("page2");
  const bgm = document.getElementById("bgm");

  page1.classList.add("hide");

  setTimeout(() => {
    page2.classList.add("show");
  }, 700);

  bgm.play().catch(() => {
    console.log("音樂播放被瀏覽器阻擋");
  });

  startHearts();
}

let heartStarted = false;

function startHearts() {
  if (heartStarted) return;
  heartStarted = true;

  setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (Math.random() * 2 + 3) + "s";
    document.body.appendChild(heart);

    setTimeout(() => {
      heart.remove();
    }, 5000);
  }, 300);
}
</script>

</body>
</html>
