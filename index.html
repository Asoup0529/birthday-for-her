<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>給最愛的妳 ❤️</title>

<style>
body {
  margin: 0;
  font-family: "Microsoft JhengHei", sans-serif;
  overflow: hidden;
}

/* 共用 */
.page {
  width: 100vw;
  height: 100vh;
  position: absolute;
  top: 0;
  left: 0;
}

/* 畫面一 */
#page1 {
  background: url("cover.jpg") center/cover no-repeat;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* 按鈕 */
button {
  padding: 14px 28px;
  font-size: 18px;
  border: none;
  border-radius: 999px;
  background: white;
  color: #ff4f81;
  cursor: pointer;
}

/* 畫面二 */
#page2 {
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  display: none;
  justify-content: center;
  align-items: center;
  text-align: center;
  color: white;
  flex-direction: column;
  padding: 20px;
}

/* 圖片二 */
.photo {
  width: 220px;
  border-radius: 20px;
  margin-bottom: 20px;
}

h1 {
  font-size: 40px;
}

p {
  font-size: 18px;
  line-height: 1.8;
}
</style>
</head>

<body>

<!-- 🎬 畫面一 -->
<div id="page1" class="page">
  <button onclick="start()">點我一下 💖</button>
</div>

<!-- 💖 畫面二 -->
<div id="page2" class="page">
  <img src="photo.jpg" class="photo">

  <h1>生日快樂 ❤️</h1>

  <p>
    謝謝妳出現在我的生命裡 💕<br>
    有妳的每一天都變得很特別<br>
    希望未來每個生日都有我陪妳
  </p>
</div>

<!-- 🎵 音樂 -->
<audio id="bgm" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
function start() {
  // 切畫面
  document.getElementById("page1").style.display = "none";
  document.getElementById("page2").style.display = "flex";

  // 播放音樂
  document.getElementById("bgm").play();
}
</script>

</body>
</html>
