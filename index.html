<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>給最愛的妳 ❤️</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Microsoft JhengHei", sans-serif;
      overflow: hidden;
      background: #fff;
    }

    .page {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: none;
    }

    .page.show {
      display: flex;
    }

    /* 第一頁 */
    #page1 {
      background: url("cover.jpg") center/cover no-repeat;
      z-index: 10;
    }

    #button-game {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .game-btn {
      position: absolute;
      padding: 14px 28px;
      font-size: 22px;
      border: none;
      border-radius: 999px;
      background: rgba(255,255,255,0.92);
      color: #ff4f81;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.22);
      min-width: 90px;
      animation: popIn 0.35s ease;
    }

    #startBtn {
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      animation: pulse 1.8s infinite;
    }

    #startBtn:hover {
      transform: translate(-50%, -50%) scale(1.06);
    }

    .game-btn:hover {
      transform: scale(1.06);
    }

    /* 第二頁：回憶頁 */
    #page2 {
      z-index: 20;
      opacity: 0;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.18) 0 2px, transparent 3px),
        radial-gradient(circle at 80% 30%, rgba(255,255,255,0.14) 0 1.5px, transparent 3px),
        radial-gradient(circle at 60% 70%, rgba(255,255,255,0.16) 0 2px, transparent 3px),
        radial-gradient(circle at 30% 80%, rgba(255,255,255,0.12) 0 1.5px, transparent 3px),
        linear-gradient(135deg, #ff9a9e, #fad0c4);
      overflow: hidden;
      flex-direction: column;
      padding: 24px;
    }

    #page2.show {
      animation: pageFadeIn 1.6s ease forwards;
    }

    .memories-wrap {
      width: min(1000px, 92vw);
      text-align: center;
      color: white;
      position: relative;
      z-index: 2;
    }

    .memories-title {
      font-size: 40px;
      margin: 0 0 18px 0;
      text-shadow: 0 3px 10px rgba(0,0,0,0.18);
    }

    .memory-card {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeUp 1s ease forwards;
    }

    .memory-card.active {
      display: flex;
    }

    .memory-card img {
      width: min(420px, 78vw);
      max-height: 52vh;
      object-fit: cover;
      border-radius: 24px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.22);
      margin-bottom: 20px;
    }

    .memory-caption {
      font-size: 22px;
      line-height: 1.8;
      max-width: 760px;
      min-height: 80px;
      padding: 0 16px;
    }

    .memory-controls {
      margin-top: 20px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .soft-btn {
      padding: 12px 24px;
      border: none;
      border-radius: 999px;
      background: rgba(255,255,255,0.92);
      color: #ff4f81;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.18);
    }

    .dots {
      margin-top: 14px;
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.45);
    }

    .dot.active {
      background: rgba(255,255,255,0.95);
    }

    /* 第三頁：情書解鎖 */
    #page3 {
      z-index: 30;
      opacity: 0;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #f7b7c3, #f9d7c4, #fff0e7);
      padding: 24px;
      overflow: hidden;
      flex-direction: column;
    }

    #page3.show {
      animation: pageFadeIn 1.2s ease forwards;
    }

    .letter-stage {
      width: min(980px, 94vw);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      position: relative;
      z-index: 2;
    }

    .letter-intro {
      font-size: 34px;
      color: #fff;
      text-shadow: 0 4px 12px rgba(0,0,0,0.12);
      text-align: center;
      margin: 0;
    }

    .envelope {
      width: min(340px, 72vw);
      height: 220px;
      position: relative;
      cursor: pointer;
      perspective: 1000px;
    }

    .envelope-body {
      position: absolute;
      inset: 0;
      background: #fff5f7;
      border-radius: 12px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.18);
      overflow: hidden;
    }

    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 120px;
      background: #ffd6df;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top;
      transition: transform 1s ease;
      z-index: 3;
    }

    .envelope.open .envelope-flap {
      transform: rotateX(180deg);
    }

    .envelope-front {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #ffe7ee, #fff7fa);
      border-radius: 12px;
      z-index: 2;
      display: flex;
      align-items: end;
      justify-content: center;
      padding-bottom: 24px;
      font-size: 26px;
      color: #ff6e95;
      font-weight: bold;
    }

    .letter-paper {
      width: min(760px, 90vw);
      min-height: 340px;
      background: rgba(255,255,255,0.92);
      border-radius: 24px;
      box-shadow: 0 16px 36px rgba(0,0,0,0.16);
      padding: 32px 28px;
      display: none;
      position: relative;
      overflow: hidden;
    }

    .letter-paper.show {
      display: block;
      animation: fadeUp 1s ease forwards;
    }

    .letter-paper::before {
      content: "";
      position: absolute;
      inset: 0;
      background: url("letter-photo.jpg") center/cover no-repeat;
      opacity: 0.08;
      pointer-events: none;
    }

    .letter-paper h2 {
      position: relative;
      z-index: 1;
      margin: 0 0 18px 0;
      color: #ff6e95;
      font-size: 34px;
      text-align: center;
    }

    .letter-text {
      position: relative;
      z-index: 1;
      color: #6b4b57;
      font-size: 20px;
      line-height: 1.95;
      min-height: 220px;
      white-space: pre-line;
    }

    .letter-sign {
      position: relative;
      z-index: 1;
      margin-top: 18px;
      color: #c05c7b;
      font-size: 18px;
      text-align: right;
    }

    /* 第四頁：彩蛋+互動 */
    #page4 {
      z-index: 40;
      opacity: 0;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffc1d6, #ffe5ef, #fff6fb);
      overflow: hidden;
      flex-direction: column;
      padding: 24px;
    }

    #page4.show {
      animation: pageFadeIn 1.2s ease forwards;
    }

    .easter-wrap {
      width: min(900px, 94vw);
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .easter-title {
      font-size: 40px;
      color: #ff5e8a;
      margin: 0 0 18px 0;
    }

    .easter-sub {
      font-size: 22px;
      color: #9d5b6f;
      margin: 0 0 26px 0;
      line-height: 1.8;
    }

    .choice-area {
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
      position: relative;
      min-height: 130px;
    }

    .like-btn, .no-btn {
      padding: 14px 28px;
      border: none;
      border-radius: 999px;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 10px 22px rgba(0,0,0,0.14);
    }

    .like-btn {
      background: #ff5e8a;
      color: white;
    }

    .no-btn {
      background: white;
      color: #ff5e8a;
      position: relative;
    }

    .final-love {
      margin-top: 28px;
      font-size: 34px;
      color: #ff4d80;
      opacity: 0;
      transform: translateY(16px);
    }

    .final-love.show {
      animation: fadeUp 1.2s ease forwards;
    }

    .small-note {
      margin-top: 14px;
      font-size: 18px;
      color: #9d5b6f;
      opacity: 0;
      transform: translateY(16px);
    }

    .small-note.show {
      animation: fadeUp 1.2s ease forwards;
      animation-delay: 0.2s;
    }

    /* 裝飾 */
    .heart {
      position: absolute;
      width: 20px;
      height: 20px;
      background: rgba(255, 0, 85, 0.75);
      transform: rotate(45deg);
      animation: floatHeart 5s linear forwards;
      z-index: 1;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      background: rgba(255, 0, 85, 0.75);
      border-radius: 50%;
    }

    .heart::before {
      top: -10px;
      left: 0;
    }

    .heart::after {
      left: -10px;
      top: 0;
    }

    .cursor {
      display: inline-block;
      margin-left: 2px;
      animation: blink 0.8s infinite;
    }

    @keyframes pageFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes floatHeart {
      0% {
        transform: translateY(100vh) rotate(45deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-20vh) rotate(45deg);
        opacity: 0;
      }
    }

    @keyframes pulse {
      0% {
        transform: translate(-50%, -50%) scale(1);
        box-shadow: 0 0 0 rgba(255,255,255,0.4);
      }
      50% {
        transform: translate(-50%, -50%) scale(1.08);
        box-shadow: 0 0 25px rgba(255,255,255,0.7);
      }
      100% {
        transform: translate(-50%, -50%) scale(1);
        box-shadow: 0 0 0 rgba(255,255,255,0.4);
      }
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.7);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    @media (max-width: 768px) {
      .memories-title,
      .easter-title,
      .letter-intro {
        font-size: 30px;
      }

      .memory-caption,
      .letter-text,
      .easter-sub {
        font-size: 18px;
        line-height: 1.8;
      }

      .letter-paper h2 {
        font-size: 28px;
      }

      .final-love {
        font-size: 28px;
      }

      .game-btn {
        font-size: 20px;
        padding: 12px 22px;
        min-width: 78px;
      }
    }
  </style>
</head>
<body>
  <!-- 第一頁 -->
  <div id="page1" class="page show">
    <div id="button-game">
      <button id="startBtn" class="game-btn" onclick="startGame()">點我一下 💖</button>
    </div>
  </div>

  <!-- 第二頁 -->
  <div id="page2" class="page">
    <div class="memories-wrap">
      <h1 class="memories-title">我們的回憶 ❤️</h1>

      <div class="memory-card active">
        <img src="memory1.jpg" alt="回憶1">
        <div class="memory-caption">這一天開始，我覺得世界突然變得特別可愛。</div>
      </div>

      <div class="memory-card">
        <img src="memory2.jpg" alt="回憶2">
        <div class="memory-caption">和妳待在一起的時候，時間總是過得特別快。</div>
      </div>

      <div class="memory-card">
        <img src="memory3.jpg" alt="回憶3">
        <div class="memory-caption">謝謝妳把平凡的日子，變成值得收藏的回憶。</div>
      </div>

      <div class="memory-card">
        <img src="memory4.jpg" alt="回憶4">
        <div class="memory-caption">每一次看著妳笑，我都會覺得自己很幸福。</div>
      </div>

      <div class="memory-card">
        <img src="memory5.jpg" alt="回憶5">
        <div class="memory-caption">有些瞬間我一直記得，因為那時候身邊的人是妳。</div>
      </div>

      <div class="memory-card">
        <img src="memory6.jpg" alt="回憶6">
        <div class="memory-caption">希望以後還有更多更多張照片，記錄我們一起走過的日子。</div>
      </div>

      <div class="dots" id="memoryDots"></div>

      <div class="memory-controls">
        <button class="soft-btn" onclick="prevMemory()">上一張</button>
        <button class="soft-btn" onclick="nextMemory()">下一張</button>
        <button class="soft-btn" onclick="goPage3()">還有一樣東西想給妳 💌</button>
      </div>
    </div>
  </div>

  <!-- 第三頁 -->
  <div id="page3" class="page">
    <div class="letter-stage">
      <h1 class="letter-intro">這封信，只想給妳看 💌</h1>

      <div class="envelope" id="envelope" onclick="openLetter()">
        <div class="envelope-body"></div>
        <div class="envelope-flap"></div>
        <div class="envelope-front">OPEN</div>
      </div>

      <div class="letter-paper" id="letterPaper">
        <h2>給最重要的妳</h2>
        <div class="letter-text" id="letterText"></div>
        <div class="letter-sign" id="letterSign">永遠站在妳這邊的人 ❤️</div>
      </div>

      <button class="soft-btn" id="toPage4Btn" style="display:none;" onclick="goPage4()">
        其實還有一個秘密… ✨
      </button>
    </div>
  </div>

  <!-- 第四頁 -->
  <div id="page4" class="page">
    <div class="easter-wrap">
      <h1 class="easter-title">最後一個小彩蛋 🎁</h1>
      <p class="easter-sub">
        如果要在這世界上選一個最可愛的人，<br>
        我一定會選妳。<br><br>
        所以我想問妳：
      </p>

      <div class="choice-area" id="choiceArea">
        <button class="like-btn" onclick="chooseLike()">喜歡 ❤️</button>
        <button class="no-btn" id="runBtn" onmouseover="moveRunBtn()" onclick="moveRunBtn()">不喜歡 🙈</button>
      </div>

      <div class="final-love" id="finalLove">我也喜歡妳 ❤️</div>
      <div class="small-note" id="finalNote">生日快樂歌送給今天最重要的妳 🎂</div>
    </div>
  </div>

  <audio id="bgm" loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <audio id="birthdaySong">
    <source src="birthday.mp3" type="audio/mpeg">
  </audio>

  <script>
    const gameTexts = ["范", "筱", "萱", "生", "日", "快", "樂", "❤️"];
    let currentIndex = 0;
    let heartsStarted = false;

    let memoryIndex = 0;
    let letterOpened = false;

    const letterMessage =
`謝謝妳來到我的生活裡。

和妳在一起之後，
我開始更期待每一天，
也更珍惜那些看起來很普通、
但其實因為有妳而變得很特別的瞬間。

希望妳今天很開心，
也希望未來每一個生日、
每一個重要的日子，
我都能陪著妳一起度過。

生日快樂，
還有，我真的很喜歡妳。`;

    function startGame() {
      const startBtn = document.getElementById("startBtn");
      startBtn.remove();
      showNextButton();
    }

    function showNextButton() {
      if (currentIndex >= gameTexts.length) {
        goPage2();
        return;
      }

      const gameArea = document.getElementById("button-game");
      const btn = document.createElement("button");
      btn.className = "game-btn";
      btn.textContent = gameTexts[currentIndex];

      const pos = getRandomPosition();
      btn.style.left = pos.x + "px";
      btn.style.top = pos.y + "px";

      btn.onclick = function () {
        btn.remove();
        currentIndex++;
        showNextButton();
      };

      gameArea.appendChild(btn);
    }

    function getRandomPosition() {
      const page = document.getElementById("page1");
      const pageWidth = page.clientWidth;
      const pageHeight = page.clientHeight;

      const btnWidth = window.innerWidth <= 768 ? 95 : 110;
      const btnHeight = window.innerWidth <= 768 ? 55 : 60;

      const paddingX = 30;
      const paddingY = 80;

      const x = Math.random() * (pageWidth - btnWidth - paddingX * 2) + paddingX;
      const y = Math.random() * (pageHeight - btnHeight - paddingY * 2) + paddingY;

      return { x, y };
    }

    function hideAllPages() {
      document.querySelectorAll(".page").forEach(page => {
        page.classList.remove("show");
        page.style.display = "none";
      });
    }

    function goPage2() {
      hideAllPages();
      const page2 = document.getElementById("page2");
      page2.style.display = "flex";
      page2.classList.add("show");

      const bgm = document.getElementById("bgm");
      bgm.play().catch(() => {});

      initDots();
      updateMemory();
      startHearts("page2");
    }

    function initDots() {
      const cards = document.querySelectorAll(".memory-card");
      const dotsWrap = document.getElementById("memoryDots");
      if (dotsWrap.children.length > 0) return;

      cards.forEach((_, i) => {
        const dot = document.createElement("div");
        dot.className = "dot";
        if (i === 0) dot.classList.add("active");
        dotsWrap.appendChild(dot);
      });
    }

    function updateMemory() {
      const cards = document.querySelectorAll(".memory-card");
      const dots = document.querySelectorAll(".dot");

      cards.forEach((card, i) => {
        card.classList.toggle("active", i === memoryIndex);
      });

      dots.forEach((dot, i) => {
        dot.classList.toggle("active", i === memoryIndex);
      });
    }

    function nextMemory() {
      const cards = document.querySelectorAll(".memory-card");
      memoryIndex = (memoryIndex + 1) % cards.length;
      updateMemory();
    }

    function prevMemory() {
      const cards = document.querySelectorAll(".memory-card");
      memoryIndex = (memoryIndex - 1 + cards.length) % cards.length;
      updateMemory();
    }

    function goPage3() {
      hideAllPages();
      const page3 = document.getElementById("page3");
      page3.style.display = "flex";
      page3.classList.add("show");
      startHearts("page3");
    }

    function openLetter() {
      if (letterOpened) return;
      letterOpened = true;

      const envelope = document.getElementById("envelope");
      const letterPaper = document.getElementById("letterPaper");
      const letterText = document.getElementById("letterText");
      const toPage4Btn = document.getElementById("toPage4Btn");

      envelope.classList.add("open");

      setTimeout(() => {
        letterPaper.classList.add("show");
        typeWriterEffect(letterText, letterMessage, 40, () => {
          toPage4Btn.style.display = "inline-block";
        });
      }, 900);
    }

    function goPage4() {
      hideAllPages();
      const page4 = document.getElementById("page4");
      page4.style.display = "flex";
      page4.classList.add("show");
      startHearts("page4");
    }

    function moveRunBtn() {
      const btn = document.getElementById("runBtn");
      const area = document.getElementById("choiceArea");
      const areaRect = area.getBoundingClientRect();

      const maxX = Math.max(0, areaRect.width - btn.offsetWidth);
      const maxY = 70;

      btn.style.position = "absolute";
      btn.style.left = Math.random() * maxX + "px";
      btn.style.top = Math.random() * maxY + "px";
    }

    function chooseLike() {
      document.getElementById("finalLove").classList.add("show");
      document.getElementById("finalNote").classList.add("show");

      const bgm = document.getElementById("bgm");
      const birthdaySong = document.getElementById("birthdaySong");

      bgm.pause();
      bgm.currentTime = 0;

      birthdaySong.play().catch(() => {});
    }

    function typeWriterEffect(element, text, speed, callback) {
      let i = 0;
      element.innerHTML = '<span class="cursor">|</span>';

      const timer = setInterval(() => {
        const currentText = text.substring(0, i + 1).replace(/\n/g, "<br>");
        element.innerHTML = currentText + '<span class="cursor">|</span>';
        i++;

        if (i >= text.length) {
          clearInterval(timer);
          element.innerHTML = text.replace(/\n/g, "<br>");
          if (callback) callback();
        }
      }, speed);
    }

    function startHearts(targetId) {
      if (heartsStarted) return;
      heartsStarted = true;

      setInterval(() => {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = (Math.random() * 2 + 3) + "s";

        const targetPage = document.getElementById(targetId) || document.body;
        targetPage.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 5000);
      }, 350);
    }
  </script>
</body>
</html>
