<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>給最愛的妳 ❤️</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Microsoft JhengHei", sans-serif;
      overflow: hidden;
      background: #fff;
    }

    .page {
      width: 100vw;
      height: 100vh;
      position: absolute;
      inset: 0;
    }

    #page1 {
      background: url("cover.jpg") center/cover no-repeat;
      z-index: 2;
      position: relative;
      transition: opacity 2s ease-in-out;
    }

    #page1.hide {
      opacity: 0;
      pointer-events: none;
    }

    #page2 {
      display: none;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      z-index: 3;
      justify-content: center;
      align-items: center;
      padding: 30px;
      opacity: 0;
      transition: opacity 2.5s ease-in-out;
      position: relative;
    }

    #page2.show {
      opacity: 1;
    }

    #button-game {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .game-btn {
      position: absolute;
      padding: 14px 28px;
      font-size: 22px;
      border: none;
      border-radius: 999px;
      background: rgba(255,255,255,0.92);
      color: #ff4f81;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.22);
      min-width: 90px;
    }

    #startBtn {
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      width: 100%;
      max-width: 1000px;
      z-index: 2;
    }

    .left-image img {
      width: 320px;
      max-width: 40vw;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .right-text {
      color: white;
      max-width: 420px;
      text-align: left;
    }

    .right-text h1,
    .right-text p,
    .right-text .signature {
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 2s ease forwards;
    }

    .right-text h1 {
      font-size: 42px;
      margin-bottom: 20px;
      animation-delay: 0.8s;
    }

    .right-text p {
      font-size: 20px;
      line-height: 2;
      margin: 0;
      animation-delay: 1.6s;
    }

    .right-text .signature {
      margin-top: 20px;
      font-size: 18px;
      animation-delay: 2.5s;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 768px) {
      .content {
        flex-direction: column;
        text-align: center;
        gap: 20px;
      }

      .left-image img {
        width: 240px;
        max-width: 75vw;
      }

      .right-text {
        text-align: center;
        max-width: 90%;
      }

      .right-text h1 {
        font-size: 34px;
      }

      .right-text p {
        font-size: 17px;
        line-height: 1.8;
      }

      .game-btn {
        font-size: 20px;
        padding: 12px 22px;
        min-width: 78px;
      }
    }
  </style>
</head>
<body>
  <div id="page1" class="page">
    <div id="button-game">
      <button id="startBtn" class="game-btn" onclick="startGame()">點我一下 💖</button>
    </div>
  </div>

  <div id="page2" class="page">
    <div class="content">
      <div class="left-image">
        <img src="photo.jpg" alt="照片">
      </div>
      <div class="right-text">
        <h1>生日快樂 ❤️</h1>
        <p>
          謝謝妳出現在我的生命裡 💕<br>
          有妳的每一天都變得特別又幸福。<br>
          希望妳每天都開開心心，<br>
          也希望未來每一個重要時刻都有我陪妳一起度過。
        </p>
        <div class="signature">給最可愛的妳 ✨</div>
      </div>
    </div>
  </div>

  <audio id="bgm" loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <script>
    const gameTexts = ["范", "筱", "萱", "生", "日", "快", "樂", "❤️"];
    let currentIndex = 0;

    function startGame() {
      document.getElementById("startBtn").remove();
      showNextButton();
    }

    function showNextButton() {
      if (currentIndex >= gameTexts.length) {
        enterPage2();
        return;
      }

      const gameArea = document.getElementById("button-game");
      const btn = document.createElement("button");
      btn.className = "game-btn";
      btn.textContent = gameTexts[currentIndex];

      const pos = getRandomPosition();
      btn.style.left = pos.x + "px";
      btn.style.top = pos.y + "px";

      btn.onclick = function () {
        btn.remove();
        currentIndex++;
        showNextButton();
      };

      gameArea.appendChild(btn);
    }

    function getRandomPosition() {
      const page = document.getElementById("page1");
      const pageWidth = page.clientWidth;
      const pageHeight = page.clientHeight;

      const btnWidth = 110;
      const btnHeight = 60;
      const padding = 40;

      return {
        x: Math.random() * (pageWidth - btnWidth - padding * 2) + padding,
        y: Math.random() * (pageHeight - btnHeight - padding * 2) + padding
      };
    }

    function enterPage2() {
      const page1 = document.getElementById("page1");
      const page2 = document.getElementById("page2");
      const bgm = document.getElementById("bgm");

      page1.classList.add("hide");

      setTimeout(() => {
        page2.style.display = "flex";
        requestAnimationFrame(() => {
          page2.classList.add("show");
        });
      }, 2000);

      bgm.play().catch(() => {});
    }
  </script>
</body>
</html>
