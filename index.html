<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>給最愛的妳 ❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Microsoft JhengHei", sans-serif;
  overflow: hidden;
}

/* 共用頁面 */
.page {
  width: 100vw;
  height: 100vh;
  position: absolute;
  top: 0;
  left: 0;
}

/* 第一頁 */
#page1 {
  background: url("cover.jpg") center/cover no-repeat;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: opacity 1s ease;
  z-index: 2;
}

/* 第二頁 */
#page2 {
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
  color: white;
  padding: 20px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 1.2s ease;
  z-index: 1;
  position: relative;
}

/* 顯示第二頁 */
#page2.show {
  opacity: 1;
  pointer-events: auto;
}

/* 隱藏第一頁 */
#page1.hide {
  opacity: 0;
  pointer-events: none;
}

/* 按鈕 */
button {
  padding: 14px 30px;
  font-size: 18px;
  border: none;
  border-radius: 999px;
  background: rgba(255,255,255,0.95);
  color: #ff4f81;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  animation: pulse 1.8s infinite;
}

button:hover {
  transform: scale(1.05);
}

@keyframes pulse {
  0% { transform: scale(1); box-shadow: 0 0 0 rgba(255,255,255,0.4); }
  50% { transform: scale(1.08); box-shadow: 0 0 25px rgba(255,255,255,0.7); }
  100% { transform: scale(1); box-shadow: 0 0 0 rgba(255,255,255,0.4); }
}

/* 第二頁圖片區 */
.photos {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
  z-index: 2;
}

.photos img {
  width: 160px;
  max-width: 38vw;
  border-radius: 18px;
  box-shadow: 0 8px 18px rgba(0,0,0,0.2);
  animation: floatPhoto 3s ease-in-out infinite;
}

.photos img:nth-child(2) {
  animation-delay: 1s;
}

@keyframes floatPhoto {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-8px); }
  100% { transform: translateY(0px); }
}

h1 {
  font-size: 40px;
  margin: 10px 0;
  z-index: 2;
}

p {
  font-size: 18px;
  line-height: 1.9;
  max-width: 700px;
  z-index: 2;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeText 1.5s ease forwards;
  animation-delay: 0.8s;
}

@keyframes fadeText {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* 愛心 */
.heart {
  position: absolute;
  width: 20px;
  height: 20px;
  background: rgba(255, 0, 85, 0.75);
  transform: rotate(45deg);
  animation: float 5s linear forwards;
  z-index: 0;
}

.heart::before,
.heart::after {
  content: "";
  position: absolute;
  width: 20px;
  height: 20px;
  background: rgba(255, 0, 85, 0.75);
  border-radius: 50%;
}

.heart::before {
  top: -10px;
  left: 0;
}

.heart::after {
  left: -10px;
  top: 0;
}

@keyframes float {
  0% {
    transform: translateY(100vh) rotate(45deg);
    opacity: 1;
  }
  100% {
    transform: translateY(-20vh) rotate(45deg);
    opacity: 0;
  }
}

/* 小字 */
.tip {
  margin-top: 12px;
  font-size: 14px;
  opacity: 0.9;
}

/* 手機版 */
@media (max-width: 480px) {
  h1 {
    font-size: 32px;
  }

  p {
    font-size: 16px;
  }

  .photos img {
    width: 140px;
  }

  button {
    font-size: 16px;
    padding: 12px 24px;
  }
}
</style>
</head>

<body>

<!-- 第一頁 -->
<div id="page1" class="page">
  <button onclick="startPage()">點我一下 💖</button>
</div>

<!-- 第二頁 -->
<div id="page2" class="page">
  <div class="photos">
    <img src="photo.jpg" alt="照片1">
  </div>

  <h1>生日快樂 ❤️</h1>

  <p>
    謝謝妳出現在我的生命裡 💕<br>
    有妳的每一天都變得特別又幸福。<br>
    希望妳每天都開開心心，<br>
    也希望未來每一個重要時刻都有我陪妳一起度過。
  </p>

  <div class="tip">給最可愛的妳 ✨</div>
</div>

<audio id="bgm" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
function startPage() {
  const page1 = document.getElementById("page1");
  const page2 = document.getElementById("page2");
  const bgm = document.getElementById("bgm");

  page1.classList.add("hide");

  setTimeout(() => {
    page2.classList.add("show");
  }, 700);

  bgm.play().catch(() => {
    console.log("音樂播放被瀏覽器阻擋");
  });

  startHearts();
}

let heartStarted = false;

function startHearts() {
  if (heartStarted) return;
  heartStarted = true;

  setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (Math.random() * 2 + 3) + "s";
    document.body.appendChild(heart);

    setTimeout(() => {
      heart.remove();
    }, 5000);
  }, 300);
}
</script>

</body>
</html>
