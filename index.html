<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>給最愛的妳 ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Microsoft JhengHei", sans-serif;
      overflow: hidden;
      background: #fff;
    }

    .page {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
    }

    /* 第一頁 */
    #page1 {
      background: url("cover.jpg") center/cover no-repeat;
      z-index: 2;
    }

    #button-game {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .game-btn {
      position: absolute;
      padding: 14px 28px;
      font-size: 22px;
      border: none;
      border-radius: 999px;
      background: rgba(255,255,255,0.92);
      color: #ff4f81;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.22);
      min-width: 90px;
      animation: popIn 0.35s ease;
    }

    #startBtn {
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      animation: pulse 1.8s infinite;
    }

    #startBtn:hover {
      transform: translate(-50%, -50%) scale(1.06);
    }

    .game-btn:hover {
      transform: scale(1.06);
    }

    /* 第二頁 */
    #page2 {
      display: none;
      z-index: 3;
      opacity: 0;
      position: relative;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.18) 0 2px, transparent 3px),
        radial-gradient(circle at 80% 30%, rgba(255,255,255,0.14) 0 1.5px, transparent 3px),
        radial-gradient(circle at 60% 70%, rgba(255,255,255,0.16) 0 2px, transparent 3px),
        radial-gradient(circle at 30% 80%, rgba(255,255,255,0.12) 0 1.5px, transparent 3px),
        linear-gradient(135deg, #ff9a9e, #fad0c4);
      overflow: hidden;
    }

    #page2.show {
      display: flex;
      justify-content: center;
      align-items: center;
      animation: pageFadeIn 2.2s ease forwards;
    }

    /* 星星閃爍層 */
    .stars,
    .stars2 {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .stars::before,
    .stars2::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(2px 2px at 10% 20%, rgba(255,255,255,0.9), transparent),
        radial-gradient(2px 2px at 25% 70%, rgba(255,255,255,0.8), transparent),
        radial-gradient(1.5px 1.5px at 40% 35%, rgba(255,255,255,0.85), transparent),
        radial-gradient(2px 2px at 55% 80%, rgba(255,255,255,0.8), transparent),
        radial-gradient(1.5px 1.5px at 70% 25%, rgba(255,255,255,0.85), transparent),
        radial-gradient(2px 2px at 85% 60%, rgba(255,255,255,0.9), transparent),
        radial-gradient(1.5px 1.5px at 92% 18%, rgba(255,255,255,0.85), transparent);
      animation: twinkle 3s infinite alternate;
    }

    .stars2::before {
      animation-duration: 5s;
      opacity: 0.6;
    }

    .content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 48px;
      width: 100%;
      max-width: 1100px;
      padding: 30px;
      position: relative;
      z-index: 2;
    }

    /* 左圖 */
    .left-image {
      flex: 0 0 auto;
    }

    .left-image img {
      width: 340px;
      max-width: 40vw;
      border-radius: 24px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.22);
      opacity: 0;
      filter: blur(12px);
      transform: scale(0.9);
    }

    .left-image img.show-image {
      animation: imageReveal 2.2s ease-in-out forwards, floatPhoto 3s ease-in-out 2.2s infinite;
    }

    /* 右字 */
    .right-text {
      color: white;
      max-width: 460px;
      text-align: left;
    }

    .right-text h1 {
      font-size: 42px;
      margin: 0 0 20px 0;
      opacity: 0;
      transform: translateY(20px);
    }

    .right-text h1.show-title {
      animation: fadeUp 1.6s ease forwards;
    }

    .typewriter-box {
      min-height: 180px;
      font-size: 20px;
      line-height: 2;
      white-space: pre-line;
      opacity: 0;
      transform: translateY(20px);
    }

    .typewriter-box.show-text {
      animation: fadeUp 1.8s ease forwards;
    }

    .signature {
      margin-top: 20px;
      font-size: 18px;
      opacity: 0;
      transform: translateY(20px);
    }

    .signature.show-signature {
      animation: fadeUp 1.6s ease forwards;
    }

    .cursor {
      display: inline-block;
      margin-left: 2px;
      animation: blink 0.8s infinite;
    }

    /* 愛心 */
    .heart {
      position: absolute;
      width: 20px;
      height: 20px;
      background: rgba(255, 0, 85, 0.75);
      transform: rotate(45deg);
      animation: floatHeart 5s linear forwards;
      z-index: 1;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      background: rgba(255, 0, 85, 0.75);
      border-radius: 50%;
    }

    .heart::before {
      top: -10px;
      left: 0;
    }

    .heart::after {
      left: -10px;
      top: 0;
    }

    @keyframes pageFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes imageReveal {
      from {
        opacity: 0;
        filter: blur(12px);
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        filter: blur(0);
        transform: scale(1);
      }
    }

    @keyframes floatPhoto {
      0% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-8px) scale(1.01); }
      100% { transform: translateY(0px) scale(1); }
    }

    @keyframes floatHeart {
      0% {
        transform: translateY(100vh) rotate(45deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-20vh) rotate(45deg);
        opacity: 0;
      }
    }

    @keyframes pulse {
      0% {
        transform: translate(-50%, -50%) scale(1);
        box-shadow: 0 0 0 rgba(255,255,255,0.4);
      }
      50% {
        transform: translate(-50%, -50%) scale(1.08);
        box-shadow: 0 0 25px rgba(255,255,255,0.7);
      }
      100% {
        transform: translate(-50%, -50%) scale(1);
        box-shadow: 0 0 0 rgba(255,255,255,0.4);
      }
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.7);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    @keyframes twinkle {
      from { opacity: 0.45; }
      to { opacity: 1; }
    }

    @media (max-width: 768px) {
      .content {
        flex-direction: column;
        gap: 24px;
        text-align: center;
      }

      .left-image img {
        width: 240px;
        max-width: 75vw;
      }

      .right-text {
        text-align: center;
        max-width: 90%;
      }

      .right-text h1 {
        font-size: 34px;
      }

      .typewriter-box {
        font-size: 17px;
        line-height: 1.8;
        min-height: 150px;
      }

      .game-btn {
        font-size: 20px;
        padding: 12px 22px;
        min-width: 78px;
      }
    }
  </style>
</head>

<body>
  <div id="page1" class="page">
    <div id="button-game">
      <button id="startBtn" class="game-btn" onclick="startGame()">點我一下 💖</button>
    </div>
  </div>

  <div id="page2" class="page">
    <div class="stars"></div>
    <div class="stars2"></div>

    <div class="content">
      <div class="left-image">
        <img id="mainPhoto" src="photo.jpg" alt="照片">
      </div>

      <div class="right-text">
        <h1 id="title">生日快樂 ❤️</h1>
        <div id="typewriter" class="typewriter-box"></div>
        <div id="signature" class="signature">給最可愛的妳 ✨</div>
      </div>
    </div>
  </div>

  <audio id="bgm" loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <script>
    const gameTexts = ["范", "筱", "萱", "生", "日", "快", "樂", "❤️"];
    let currentIndex = 0;
    let heartsStarted = false;

    const message =
`謝謝妳出現在我的生命裡 💕
有妳的每一天都變得特別又幸福。
希望妳每天都開開心心，
也希望未來每一個重要時刻都有我陪妳一起度過。`;

    function startGame() {
      const startBtn = document.getElementById("startBtn");
      startBtn.remove();
      showNextButton();
    }

    function showNextButton() {
      if (currentIndex >= gameTexts.length) {
        enterPage2();
        return;
      }

      const gameArea = document.getElementById("button-game");
      const btn = document.createElement("button");
      btn.className = "game-btn";
      btn.textContent = gameTexts[currentIndex];

      const pos = getRandomPosition();
      btn.style.left = pos.x + "px";
      btn.style.top = pos.y + "px";

      btn.onclick = function () {
        btn.remove();
        currentIndex++;
        showNextButton();
      };

      gameArea.appendChild(btn);
    }

    function getRandomPosition() {
      const page = document.getElementById("page1");
      const pageWidth = page.clientWidth;
      const pageHeight = page.clientHeight;

      const btnWidth = window.innerWidth <= 768 ? 95 : 110;
      const btnHeight = window.innerWidth <= 768 ? 55 : 60;

      const paddingX = 30;
      const paddingY = 80;

      const x = Math.random() * (pageWidth - btnWidth - paddingX * 2) + paddingX;
      const y = Math.random() * (pageHeight - btnHeight - paddingY * 2) + paddingY;

      return { x, y };
    }

    function enterPage2() {
      const page1 = document.getElementById("page1");
      const page2 = document.getElementById("page2");
      const bgm = document.getElementById("bgm");
      const mainPhoto = document.getElementById("mainPhoto");
      const title = document.getElementById("title");
      const typewriterBox = document.getElementById("typewriter");
      const signature = document.getElementById("signature");

      page1.style.display = "none";
      page2.classList.add("show");

      bgm.play().catch(() => {
        console.log("音樂播放被瀏覽器阻擋");
      });

      startHearts();

      setTimeout(() => {
        mainPhoto.classList.add("show-image");
      }, 200);

      setTimeout(() => {
        title.classList.add("show-title");
      }, 2200);

      setTimeout(() => {
        typewriterBox.classList.add("show-text");
        typeWriterEffect(typewriterBox, message, 55, () => {
          signature.classList.add("show-signature");
        });
      }, 3000);
    }

    function typeWriterEffect(element, text, speed, callback) {
      let i = 0;
      element.innerHTML = '<span class="cursor">|</span>';

      const timer = setInterval(() => {
        const currentText = text.substring(0, i + 1)
          .replace(/\n/g, "<br>");
        element.innerHTML = currentText + '<span class="cursor">|</span>';
        i++;

        if (i >= text.length) {
          clearInterval(timer);
          element.innerHTML = text.replace(/\n/g, "<br>");
          if (callback) callback();
        }
      }, speed);
    }

    function startHearts() {
      if (heartsStarted) return;
      heartsStarted = true;

      setInterval(() => {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = (Math.random() * 2 + 3) + "s";
        document.getElementById("page2").appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 5000);
      }, 300);
    }
  </script>
</body>
</html>
